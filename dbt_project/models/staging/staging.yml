version: 2

models:
  - name: stg_transactions
    columns:
      - name: txn_id
        tests:
          - unique
          - not_null
      - name: txn_type
        tests:
          - not_null
          - accepted_values:
              values: ["TRANSFER", "CASH_OUT"]
      - name: amount
        tests:
          - not_null
      - name: is_fraud
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
